        - column: scan_completed_at
          value:
            str: "2099-01-01T00:05:00Z"
        - column: scan_status_updated_at
          value:
            str: "2024-01-01T00:05:00Z"
        - column: scan_attempted_at
          value:
            str: "2024-01-01T00:05:00Z"
        - column: is_in_object_store
