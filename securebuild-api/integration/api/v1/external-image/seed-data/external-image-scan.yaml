    - columns:
        - column: digest
          value:
            str: "sha256:abc123def456789012345678901234567890123456789012345678901234"
        - column: arch
          value:
            str: "aarch64"
        - column: parsed_results
          value:
            str: '{"counts":{"critical":0,"high":1,"medium":0,"low":0,"total":1,"fixable":0}}'
        - column: created_at
          value:
            str: "2024-01-01T00:00:00Z"
        - column: status
          value:
            str: "succeeded"
        - column: scan_completed_at
          value:
            str: "2099-01-01T00:05:00Z"
        - column: scan_status_updated_at
          value:
            str: "2024-01-01T00:05:00Z"
        - column: is_in_object_store
          value:
            str: "true"
    # Successful but stale scan used by the on-demand scan tests
    - columns:
        - column: digest
          value:
            str: "sha256:stale1234567890123456789012345678901234567890123456789012345"
        - column: arch
          value:
            str: "x86_64"
        - column: created_at
          value:
            str: "2024-01-01T00:00:00Z"
        - column: status
          value:
            str: "succeeded"
        - column: scan_completed_at
          value:
            str: "2024-01-01T00:05:00Z"
        - column: scan_status_updated_at
          value:
            str: "2024-01-01T00:05:00Z"
        - column: scan_attempted_at
          value:
            str: "2024-01-01T00:05:00Z"
        - column: is_in_object_store
          value:
            str: "true"
    # Queued scan
    - columns:
        - column: digest
          value:
            str: "sha256:queued123456789012345678901234567890123456789012345678901234"
        - column: arch
          value:
            str: "x86_64"
        - column: created_at
          value:
            str: "2024-01-01T00:00:00Z"
        - column: status
          value:
            str: "queued"
        - column: scan_status_updated_at
          value:
            str: "2024-01-01T00:00:30Z"
    # Running scan
    - columns:
        - column: digest
          value:
            str: "sha256:running123456789012345678901234567890123456789012345678901234"
        - column: arch
          value:
            str: "x86_64"
        - column: created_at
          value:
            str: "2024-01-01T00:00:00Z"
        - column: status
          value:
            str: "running"
        - column: scan_status_updated_at
          value:
            str: "2024-01-01T00:01:00Z"
    # Failed scan
    - columns:
        - column: digest
          value:
            str: "sha256:failed123456789012345678901234567890123456789012345678901234"
        - column: arch
          value:
            str: "x86_64"
        - column: created_at
          value:
            str: "2024-01-01T00:00:00Z"
        - column: status
          value:
            str: "failed"
        - column: scan_status_message
          value:
            str: "Failed to pull image: authentication required"
        - column: scan_status_updated_at
          value:
            str: "2024-01-01T00:02:00Z"
