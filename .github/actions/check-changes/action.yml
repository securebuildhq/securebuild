name: 'Check Changes'
description: 'Determine which build and test suites need to run based on changed files'
outputs:
  run-app:
    description: 'Whether to run securebuild-app jobs'
    value: ${{ steps.changes.outputs.run-app }}
  run-api:
    description: 'Whether to run securebuild-api jobs'
    value: ${{ steps.changes.outputs.run-api }}
  run-go:
    description: 'Whether to run Go jobs'
    value: ${{ steps.changes.outputs.run-go }}
  run-all:
    description: 'Whether to run all jobs'
    value: ${{ steps.changes.outputs.run-all }}

runs:
  using: 'composite'
  steps:
    - name: Check for file changes
      id: changes
      shell: bash
      run: |
        # Get changed files between base and head
        CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
        echo "Changed files:"
        echo "$CHANGED_FILES"

        # Check if workflow files, Makefile, or schema changed (run all tests)
        if echo "$CHANGED_FILES" | grep -q -E '^\.github/workflows/.*\.yml$|^Makefile$|^db/schema/tables/'; then
          echo "Workflow, Makefile, or schema changed - running all jobs"
          echo "run-all=true" >> $GITHUB_OUTPUT
          echo "run-app=true" >> $GITHUB_OUTPUT
          echo "run-api=true" >> $GITHUB_OUTPUT
          echo "run-go=true" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Check for securebuild-app changes
        if echo "$CHANGED_FILES" | grep -q '^securebuild-app/'; then
          echo "run-app=true" >> $GITHUB_OUTPUT
        else
          echo "run-app=false" >> $GITHUB_OUTPUT
        fi

        # Check for securebuild-api changes
        if echo "$CHANGED_FILES" | grep -q '^securebuild-api/'; then
          echo "run-api=true" >> $GITHUB_OUTPUT
        else
          echo "run-api=false" >> $GITHUB_OUTPUT
        fi

        # Check for Go changes
        if echo "$CHANGED_FILES" | grep -q -E '^pkg/|^cmd/|^integration/|^go\.mod$|^go\.sum$'; then
          echo "run-go=true" >> $GITHUB_OUTPUT
        else
          echo "run-go=false" >> $GITHUB_OUTPUT
        fi

        echo "run-all=false" >> $GITHUB_OUTPUT
