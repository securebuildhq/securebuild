name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Determine which build jobs need to run based on changed files
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      run-www: ${{ steps.check.outputs.run-www }}
      run-app: ${{ steps.check.outputs.run-app }}
      run-docs: ${{ steps.check.outputs.run-docs }}
      run-go: ${{ steps.check.outputs.run-go }}
      run-all: ${{ steps.check.outputs.run-all }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changes
        id: check
        uses: ./.github/actions/check-changes

  securebuild-www-build:
    needs: check-changes
    if: needs.check-changes.outputs.run-www == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Cache Node.js modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          securebuild-www/node_modules
          securebuild-www/.next/cache
        key: ${{ runner.os }}-node-www-${{ hashFiles('securebuild-www/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-www-

    - name: Install Node.js dependencies
      uses: ./.github/actions/install-npm-dependencies
      with:
        working-directory: securebuild-www

    - name: Build
      run: |
        cd securebuild-www
        npm run build
      env:
        CI: true

  securebuild-app-build:
    needs: check-changes
    if: needs.check-changes.outputs.run-app == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Cache Node.js modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          securebuild-app/node_modules
          securebuild-app/.next/cache
        key: ${{ runner.os }}-node-app-${{ hashFiles('securebuild-app/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-app-

    - name: Install Node.js dependencies
      uses: ./.github/actions/install-npm-dependencies
      with:
        working-directory: securebuild-app

    - name: Build
      run: |
        cd securebuild-app
        npm run build
      env:
        CI: true

  securebuild-docs-build:
    needs: check-changes
    if: needs.check-changes.outputs.run-docs == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Cache Node.js modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          securebuild-docs/node_modules
          securebuild-docs/.next/cache
        key: ${{ runner.os }}-node-docs-${{ hashFiles('securebuild-docs/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-docs-

    - name: Install dependencies
      run: |
        cd securebuild-docs
        npm install --legacy-peer-deps

    - name: Build
      run: |
        cd securebuild-docs
        npm run build
      env:
        CI: true

  worker-build:
    needs: check-changes
    if: needs.check-changes.outputs.run-go == 'true' || needs.check-changes.outputs.run-all == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: false

    - name: Restore Go cache
      uses: actions/cache/restore@v5
      id: go-cache
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download Go modules
      run: go mod download

    - name: Build worker binary
      run: make build-worker

    - name: Save Go cache
      uses: actions/cache/save@v5
      if: steps.go-cache.outputs.cache-hit != 'true'
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
