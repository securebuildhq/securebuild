name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Determine which test suites need to run based on changed files
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      run-app: ${{ steps.check.outputs.run-app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changes
        id: check
        uses: ./.github/actions/check-changes

  e2e-tests:
    needs: check-changes
    if: needs.check-changes.outputs.run-app == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: app-admin-login
            service: securebuild-app

    name: E2E - ${{ matrix.project }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Cache Node.js modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          ${{ matrix.service }}/node_modules
          e2e/node_modules
        key: ${{ runner.os }}-node-${{ matrix.service }}-e2e-${{ hashFiles(format('{0}/package-lock.json', matrix.service), 'e2e/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ matrix.service }}-e2e-

    - name: Install SchemaHero
      uses: ./.github/actions/install-schemahero

    - name: Install ${{ matrix.service }} dependencies
      uses: ./.github/actions/install-npm-dependencies
      with:
        working-directory: ${{ matrix.service }}

    - name: Install E2E test dependencies
      uses: ./.github/actions/install-npm-dependencies
      with:
        working-directory: e2e

    - name: Install Playwright browsers and dependencies
      run: |
        cd e2e
        npx playwright install --with-deps chromium

    - name: Run E2E test - ${{ matrix.project }}
      run: |
        cd e2e
        npm test -- --project=${{ matrix.project }}
      env:
        CI: true

    - name: Upload Playwright report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report-${{ matrix.project }}
        path: e2e/playwright-report/
        retention-days: 7

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-${{ matrix.project }}
        path: e2e/test-results/
        retention-days: 7
