name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Determine which test suites need to run based on changed files
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      run-app: ${{ steps.check.outputs.run-app }}
      run-go: ${{ steps.check.outputs.run-go }}
      run-all: ${{ steps.check.outputs.run-all }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changes
        id: check
        uses: ./.github/actions/check-changes

  securebuild-app-tests:
    needs: check-changes
    if: needs.check-changes.outputs.run-app == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Cache Node.js modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          securebuild-app/node_modules
          securebuild-app/.next/cache
        key: ${{ runner.os }}-node-app-${{ hashFiles('securebuild-app/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-app-

    - name: Install Node.js dependencies
      uses: ./.github/actions/install-npm-dependencies
      with:
        working-directory: securebuild-app

    - name: Run unit tests
      run: |
        cd securebuild-app
        npm test
      env:
        CI: true

  go-unit-tests:
    needs: check-changes
    if: needs.check-changes.outputs.run-go == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: false

    - name: Restore Go cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Run Go unit tests
      run: make test-unit-go
      env:
        # GitHub token for updater tests (provided automatically by GitHub Actions)
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Docker credentials for externalimage tests
        CI_IMAGE_PULL_DOCKER_USER: ${{ secrets.CI_IMAGE_PULL_DOCKER_USER }}
        CI_IMAGE_PULL_DOCKER_PASSWORD: ${{ secrets.CI_IMAGE_PULL_DOCKER_PASSWORD }}
