database: securebuild
name: passwordless_login_nonce
requires:
  - securebuild_user
seedData:
  rows:
    # Test verification code for e2e tests
    - columns:
        - column: id
          value:
            str: "e2e-test-nonce-id"
        - column: email
          value:
            str: "test@securebuild.io"
