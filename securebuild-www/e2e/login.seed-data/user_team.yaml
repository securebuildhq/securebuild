database: securebuild
name: user_team
requires:
  - securebuild_user
  - securebuild_team
seedData:
  rows:
    # Link test user to test team
    - columns:
        - column: user_id
          value:
            str: "e2e-test-user-id"
        - column: team_id
          value:
            str: "e2e-test-team-id"
