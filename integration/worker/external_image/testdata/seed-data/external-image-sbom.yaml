            str: "syft"
        - column: created_at
          value:
            str: "2026-01-14T00:00:00Z"
    # Fresh SBOM — scanned 1h before reference (within 4h interval, NOT stale)
    - columns:
        - column: digest
          value:
            str: "sha256:fresh-active-digest-12345678901234567890123456789012"
        - column: arch
