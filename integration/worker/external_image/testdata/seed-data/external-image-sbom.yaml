database: securebuild
name: external_image_sbom
requires:
  - external-image-tag
seedData:
  rows:
    # Active tier SBOM — scanned 5h before reference (stale for 4h interval)
    - columns:
        - column: digest
          value:
            str: "sha256:active-tier-digest-12345678901234567890123456789012"
        - column: arch
          value:
            str: "x86_64"
        - column: sbom
          value:
            str: '{"artifacts":[]}'
        - column: source
          value:
            str: "syft"
        - column: created_at
          value:
            str: "2026-01-14T00:00:00Z"
        - column: last_security_scanned_at
          value:
            str: "2026-01-15T07:00:00Z"
    # Recent tier SBOM — scanned 2 days before reference (stale for 4h interval)
    - columns:
        - column: digest
