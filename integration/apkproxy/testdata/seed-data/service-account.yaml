database: securebuild
name: service_account
requires:
  - securebuild_team
seedData:
  rows:
    - columns:
        - column: id
          value:
            str: "test-apk-sa"
        - column: name
          value:
            str: "APK Test Service Account"
        - column: partial_value
          value:
            str: "testpass"
        - column: expires_at
          value:
            str: "2030-12-31T23:59:59Z"
        - column: created_at
          value:
            str: "2025-01-01T00:00:00Z"
        - column: bcrypt_hash
          value:
            # bcrypt hash of "testpassword"
            str: "$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy"
        - column: team_id
          value:
            str: "test-apk-team"
        - column: expires_in
          value:
            str: "5 years"
        - column: hash_algorithm
          value:
            str: "bcrypt"
