database: securebuild
name: image_catalog
requires:
  - image
seedData:
  rows:
    - columns:
        - column: id
          value:
            str: "test-image-catalog-latest"
        - column: name
          value:
            str: "test-image"
        - column: tag
          value:
            str: "latest"
        - column: created_at
          value:
            str: "2025-01-01T00:00:00Z"
        - column: updated_at
          value:
            str: "2025-01-01T00:00:00Z"
        - column: image_id
          value:
            str: "test-image-oci"
        - column: apko_id
          value:
            str: "test-apko-id"
        - column: apko_version_id
          value:
            str: "test-apko-version-id"
        - column: is_published
          value:
            str: "true"
