# Compose specification (no legacy version key) — use current Docker Compose / Engine on Linux.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: securebuild
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrations:
    image: securebuild-migrations:latest
    restart: "no"
    environment:
      DB_URI: postgres://postgres:password@postgres:5432/securebuild?sslmode=disable
    depends_on:
      - postgres
    deploy:
      restart_policy:
        condition: none

  worker:
    image: securebuild-worker:latest
    command: ["run"]
    # Dev-only, Linux + current Docker only: melange/bubblewrap needs nested namespaces and
    # mount(MS_REC|MS_SLAVE) on /. Not for production. If bwrap still fails, check host
    # AppArmor (Ubuntu 24.04+); compose cannot fix host policy (containers/bubblewrap#505).
    privileged: true
    pid: host
    ipc: host
    userns_mode: host
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - label:disable
    cap_add:
      - SYS_ADMIN
    environment:
      DB_URI: postgres://postgres:password@postgres:5432/securebuild?sslmode=disable
      SECUREBUILD_CONFIG_SOURCE: /securebuild-config.yaml
      PIPELINE_DIR: /var/run/securebuild/pipelines
      # Observability. Default "none" keeps dev quiet; set TELEMETRY_BACKEND=otlp (or datadog) to enable.
      # Containers reach the host-installed Alloy agent via the docker host gateway.
      TELEMETRY_BACKEND: ${TELEMETRY_BACKEND:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: securebuild-worker
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=development}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${REPO_ROOT}/securebuild-config.yaml:/securebuild-config.yaml:ro
      - ${REPO_ROOT}/dev-pipelines:/var/run/securebuild/pipelines
      # Persist local-backend signing keys and InstallBuildEnv drops under /root across task restarts
      - securebuild_worker_home:/root
    depends_on:
      - postgres

  app:
    image: securebuild-app:latest
    env_file:
      - ./securebuild-app/.env.local
    environment:
      DB_URI: postgres://postgres:password@postgres:5432/securebuild?sslmode=disable
      HOSTNAME: "0.0.0.0"
      PIPELINE_DIR: /var/run/securebuild/pipelines
      TELEMETRY_BACKEND: ${TELEMETRY_BACKEND:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: securebuild-app
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=development}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${REPO_ROOT}/securebuild-app/.env.local:/app/.env.local:ro
      - ${REPO_ROOT}/dev-pipelines:/var/run/securebuild/pipelines
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  api:
    image: securebuild-api:latest
    env_file:
      - ./securebuild-app/.env.local
    environment:
      # Override DB_URI to point at the compose postgres (env_file has localhost:15432)
      DB_URI: postgres://postgres:password@postgres:5432/securebuild?sslmode=disable
      HOSTNAME: "0.0.0.0"
      TELEMETRY_BACKEND: ${TELEMETRY_BACKEND:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: securebuild-api
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=development}
      # R2 object store credentials for reading scan/SBOM blobs (Phase 3)
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_IMAGE_SCANS_BUCKET_NAME: ${R2_IMAGE_SCANS_BUCKET_NAME:-}
      R2_USE_DYNAMIC_FOLDER: ${R2_USE_DYNAMIC_FOLDER:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3002:3002"
    depends_on:
      - postgres

  apk-proxy:
    image: securebuild-worker:latest
    command: ["apk-proxy"]
    environment:
      DB_URI: postgres://postgres:password@postgres:5432/securebuild?sslmode=disable
      SECUREBUILD_CONFIG_SOURCE: /securebuild-config.yaml
      TELEMETRY_BACKEND: ${TELEMETRY_BACKEND:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: securebuild-apk-proxy
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=development}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${REPO_ROOT}/securebuild-config.yaml:/securebuild-config.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  oci-proxy:
    image: securebuild-worker:latest
    command: ["oci-proxy"]
    environment:
      DB_URI: postgres://postgres:password@postgres:5432/securebuild?sslmode=disable
      SECUREBUILD_CONFIG_SOURCE: /securebuild-config.yaml
      TELEMETRY_BACKEND: ${TELEMETRY_BACKEND:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: securebuild-oci-proxy
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=development}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${REPO_ROOT}/securebuild-config.yaml:/securebuild-config.yaml:ro
    ports:
      - "8081:8081"
    depends_on:
      - postgres

volumes:
  postgres_data: {}
  securebuild_worker_home: {}
