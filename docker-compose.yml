version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: securebuild
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrations:
    image: securebuild-migrations:latest
    environment:
      DB_URI: postgres://postgres:password@postgres:5432/securebuild?sslmode=disable
    depends_on:
      - postgres
    deploy:
      restart_policy:
        condition: none

  worker:
    image: securebuild-worker:latest
    command: ["run"]
    environment:
      DB_URI: postgres://postgres:password@postgres:5432/securebuild?sslmode=disable
      SECUREBUILD_CONFIG_SOURCE: /securebuild-config.yaml
    volumes:
      - ${REPO_ROOT}/securebuild-config.yaml:/securebuild-config.yaml:ro
      - ${REPO_ROOT}/dev-pipelines:/var/run/securebuild/pipelines
    depends_on:
      - postgres

  app:
    image: securebuild-app:latest
    env_file:
      - ./securebuild-app/.env.local
    environment:
      DB_URI: postgres://postgres:password@postgres:5432/securebuild?sslmode=disable
      HOSTNAME: "0.0.0.0"
      PIPELINE_DIR: /var/run/securebuild/pipelines
    volumes:
      - ${REPO_ROOT}/securebuild-app/.env.local:/app/.env.local:ro
      - ${REPO_ROOT}/dev-pipelines:/var/run/securebuild/pipelines
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  apk-proxy:
    image: securebuild-worker:latest
    command: ["apk-proxy"]
    environment:
      DB_URI: postgres://postgres:password@postgres:5432/securebuild?sslmode=disable
      SECUREBUILD_CONFIG_SOURCE: /securebuild-config.yaml
    volumes:
      - ${REPO_ROOT}/securebuild-config.yaml:/securebuild-config.yaml:ro
    ports:
      - "8880:8880"
    depends_on:
      - postgres

  oci-proxy:
    image: securebuild-worker:latest
    command: ["oci-proxy"]
    environment:
      DB_URI: postgres://postgres:password@postgres:5432/securebuild?sslmode=disable
      SECUREBUILD_CONFIG_SOURCE: /securebuild-config.yaml
    volumes:
      - ${REPO_ROOT}/securebuild-config.yaml:/securebuild-config.yaml:ro
    ports:
      - "8888:8888"
    depends_on:
      - postgres

volumes:
  postgres_data: {}
