database: securebuild
name: external_image_pull_credential
schema:
  postgres:
    primaryKey:
    - id
    indexes:
    - name: external_image_pull_credential_cleanup_idx
      columns:
      - delete_after
    columns:
    - name: id
      type: text
      constraints:
        notNull: true
    - name: team_id
      type: text
      constraints:
        notNull: true
    - name: registry
      type: text
      constraints:
        notNull: true
    - name: image_name
      type: text
      constraints:
        notNull: true
    - name: credential_type
      type: text
      constraints:
        notNull: true
    - name: username
      type: text
      constraints:
        notNull: true
    - name: password
      type: text
      constraints:
        notNull: true
    - name: provider_expires_at
      type: timestamp with time zone
    - name: delete_after
      type: timestamp with time zone
      constraints:
        notNull: true
    - name: created_at
      type: timestamp with time zone
      constraints:
        notNull: true
