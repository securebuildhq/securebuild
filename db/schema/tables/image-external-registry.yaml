database: securebuild
name: image_external_registry
schema:
  postgres:
    primaryKey:
      - id
    columns:
      - name: id
        type: text
        constraints:
          notNull: true
      - name: image_id
        type: text
        constraints:
          notNull: true
      - name: username
        type: text
        constraints:
          notNull: true
      - name: password
        type: text
        constraints:
          notNull: true
      - name: registry_url
        type: text
        constraints:
          notNull: true
