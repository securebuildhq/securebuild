database: securebuild
name: external_image_tag
schema:
  postgres:
    primaryKey:
    - registry
    - image_name
    - image_tag
    indexes:
      - name: idx_external_image_tag_digest
        columns:
          - digest
        isUnique: false
    columns:
    - name: registry
      type: text
    - name: image_name
      type: text
      constraints:
        notNull: true
    - name: image_tag
      type: text
      constraints:
        notNull: true
    - name: created_at
      type: timestamp with time zone
      constraints:
        notNull: true
    - name: digest
      type: text
      constraints:
        notNull: true
    - name: next_check_digest_at
      type: timestamp with time zone
      constraints:
        notNull: true
    - name: next_scan_at
      type: timestamp with time zone
      constraints:
        notNull: true
