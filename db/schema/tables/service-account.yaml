database: securebuild
name: service_account
requires:
  - securebuild-team
schema:
  postgres:
    primaryKey:
    - id
    columns:
    - name: id
      type: text
      constraints:
        notNull: true
    - name: name
      type: text
      constraints:
        notNull: true
    - name: partial_value
      type: text
      constraints:
        notNull: true
    - name: expires_at
      type: timestamp with time zone
    - name: created_at
      type: timestamp with time zone
      constraints:
        notNull: true
    - name: bcrypt_hash
      type: text
      constraints:
        notNull: true
    - name: team_id
      type: text
    - name: last_used_at
      type: timestamp with time zone
    - name: expires_in
      type: text
    - name: hash_algorithm
      type: text
      default: bcrypt
      constraints:
        notNull: true
    - name: is_system
      type: boolean
      default: false
      constraints:
        notNull: true
