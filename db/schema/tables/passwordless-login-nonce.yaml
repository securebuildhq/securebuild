database: securebuild
name: passwordless_login_nonce
schema:
  postgres:
    primaryKey:
    - id
    columns:
    - name: id
      type: text
      constraints:
        notNull: true
    - name: email
      type: text
      constraints:
        notNull: true
    - name: nonce
      type: text
      constraints:
        notNull: true
    - name: created_at
      type: timestamp with time zone
      constraints:
        notNull: true
    - name: expires_at
      type: timestamp with time zone
      constraints:
        notNull: true
    - name: consumed_at
      type: timestamp with time zone
    indexes:
    - columns:
      - email
      - nonce
      name: idx_passwordless_login_nonce_email_nonce
    - columns:
      - expires_at
      name: idx_passwordless_login_nonce_expires_at