database: securebuild
name: generate_melange_prompt
schema:
  postgres:
    primaryKey:
    - id
    columns:
    - name: id
      type: text
      constraints:
        notNull: true
    - name: generate_melange_id
      type: text
      constraints:
        notNull: true
    - name: prompt
      type: text
      constraints:
        notNull: true
    - name: response
      type: text
    - name: created_at
      type: timestamp with time zone
      constraints:
        notNull: true
    - name: melange_yaml
      type: text
