database: securebuild
name: external_image_credential
schema:
  postgres:
    primaryKey:
    - image_name
    - registry
    - team_id
    columns:
    - name: registry
      type: text
      constraints:
        notNull: true
    - name: image_name
      type: text
      constraints:
        notNull: true
    - name: username
      type: text
      constraints:
        notNull: true
    - name: password
      type: text
      constraints:
        notNull: true
    - name: created_at
      type: timestamp with time zone
      constraints:
        notNull: true
    - name: team_id
      type: text