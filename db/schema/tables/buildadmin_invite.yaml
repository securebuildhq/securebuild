database: securebuild
name: buildadmin_invite
schema:
  postgres:
    primaryKey:
    - id
    indexes:
    - columns:
      - invite_token
      name: idx_buildadmin_invite_invite_token
      isUnique: true
    columns:
    - name: id
      type: text
      constraints:
        notNull: true
    - name: email
      type: text
      constraints:
        notNull: true
    - name: invite_token
      type: text
      constraints:
        notNull: true
    - name: invited_by_user_id
      type: text
      constraints:
        notNull: true
    - name: created_at
      type: timestamp with time zone
      constraints:
        notNull: true
    - name: expires_at
      type: timestamp with time zone
      constraints:
        notNull: true
    - name: accepted_at
      type: timestamp with time zone
