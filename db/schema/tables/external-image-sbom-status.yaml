database: securebuild
name: external_image_sbom_status
schema:
  postgres:
    primaryKey:
    - digest
    columns:
    - name: digest
      type: text
      constraints:
        notNull: true
    - name: status
      type: text
      default: "pending"
      constraints:
        notNull: true
    - name: status_message
      type: text
    - name: created_at
      type: timestamp with time zone
      constraints:
        notNull: true
    - name: updated_at
      type: timestamp with time zone
    - name: status_updated_at
      type: timestamp with time zone
