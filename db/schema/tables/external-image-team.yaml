database: securebuild
name: external_image_team
schema:
  postgres:
    primaryKey:
    - team_id
    - registry
    - image_name
    - image_tag
    columns:
    - name: team_id
      type: text
      constraints:
        notNull: true
    - name: registry
      type: text
    - name: image_name
      type: text
      constraints:
        notNull: true
    - name: image_tag
      type: text
      constraints:
        notNull: true
    - name: created_at
      type: timestamp with time zone
      constraints:
        notNull: true