database: securebuild
name: buildadmin_session
schema:
  postgres:
    primaryKey:
    - id
    columns:
    - name: id
      type: text
      constraints:
        notNull: true
    - name: user_id
      type: text
      constraints:
        notNull: true
    - name: expires_at
      type: timestamp with time zone
      constraints:
        notNull: true
