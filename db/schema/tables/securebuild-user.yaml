database: securebuild
name: securebuild_user
requires: []
schema:
  postgres:
    primaryKey:
    - id
    columns:
    - name: id
      type: text
      constraints:
        notNull: true
    - name: email
      type: text
      constraints:
        notNull: true
    - name: first_name
      type: text
    - name: last_name
      type: text
    - name: picture
      type: text
      constraints:
        notNull: true
    - name: hosted_domain
      type: text
    - name: created_at
      type: timestamp with time zone
      constraints:
        notNull: true
    - name: last_login_at
      type: timestamp with time zone
    - name: last_active_at
      type: timestamp with time zone
    - name: role
      type: text
      constraints:
        notNull: true
      default: "admin"
    - name: allow_god_mode
      type: boolean
      constraints:
        notNull: true
      default: false
seedData:
  rows:
    - columns:
        - column: id
          value:
            str: "dev-user"
        - column: email
          value:
            str: "dev@securebuild.com"
        - column: first_name
          value:
            str: "Dev"
        - column: last_name
          value:
            str: "User"
        - column: picture
          value:
            str: "https://securebuild.com/img/avatar-dev.png"
        - column: hosted_domain
          value:
            str: "securebuild.com"
        - column: created_at
          value:
            str: "2024-01-01T00:00:00Z"
        - column: role
          value:
            str: "admin"