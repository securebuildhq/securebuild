database: securebuild
name: user_team
requires:
  - securebuild-user
  - securebuild-team
schema:
  postgres:
    primaryKey:
    - user_id
    - team_id
    columns:
    - name: user_id
      type: text
      constraints:
        notNull: true
    - name: team_id
      type: text
      constraints:
        notNull: true
seedData:
  rows:
    - columns:
        - column: user_id
          value:
            str: "dev-user"
        - column: team_id
          value:
            str: "dev-team"
