package:
  name: openssl
  version: 1:3.2.2-6.0.1.el9_5.1
  epoch: 0
  description: "openssl library package"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      expected-sha256: ""
      uri: https://example.com/source.tar.gz
      strip-components: 1

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: openssl-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - openssl
    description: openssl dev

update:
  enabled: true
  release-monitor:
    identifier: 0
