package:
  name: zlib
  version: 1.2.11-40.el9
  epoch: 0
  description: "zlib library package"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      expected-sha256: ""
      uri: https://example.com/source.tar.gz
      strip-components: 1

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: zlib-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - zlib
    description: zlib dev

update:
  enabled: true
  release-monitor:
    identifier: 0
