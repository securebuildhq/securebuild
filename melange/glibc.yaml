package:
  name: glibc
  version: 2.34-168.0.1.el9_6.20
  epoch: 0
  description: "glibc library package"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      expected-sha256: ""
      uri: https://example.com/source.tar.gz
      strip-components: 1

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: glibc-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - glibc
    description: glibc dev

update:
  enabled: true
  release-monitor:
    identifier: 0
