package:
  name: findutils
  version: 1:4.8.0-7.el9
  epoch: 0
  description: "findutils library package"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      expected-sha256: ""
      uri: https://example.com/source.tar.gz
      strip-components: 1

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: findutils-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - findutils
    description: findutils dev

update:
  enabled: true
  release-monitor:
    identifier: 0
