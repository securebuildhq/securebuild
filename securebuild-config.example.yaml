# Example SecureBuild worker configuration for self-hosted / OSS deployments.
# Copy to securebuild-config.yaml (or another path) and set SECUREBUILD_CONFIG_SOURCE
# to that file path. Environment variables with the same names as YAML keys (UPPER_SNAKE_CASE)
# override values from this file when set.
#
# See: https://github.com/securebuildhq/securebuild-docs (Self-hosted configuration)

db_uri: postgres://postgres:password@localhost:15432/securebuild?sslmode=disable

# OCI registry: single prefix before the image name (host, or host/path — no scheme, no tag).
registry_image_prefix: ghcr.io/your-org/securebuild
registry_username: your-registry-user
registry_password: your-registry-token-or-password

# Public Alpine/APK repository origin (HTTPS, no trailing slash).
apk_repository: https://apk.example.com

# APK signing (base64-encoded PEM; see project documentation).
apk_public_key_name: cve0-signing.rsa.pub
apk_public_key_data: "<base64 data>"  # replace: base64-encoded public key PEM
apk_signing_key_data: "<base64 data>"  # replace: base64-encoded private key PEM
apk_signing_key_name: cve0-signing.rsa.key

# S3-compatible object storage (Cloudflare R2, AWS S3, MinIO, etc.).
r2_endpoint: https://s3.example.com
r2_access_key: replace-me  # replace with your R2 or S3 access key
r2_secret_key: replace-me  # replace with your R2 or S3 secret key
r2_bucket_name: securebuild
r2_feed_bucket_name: securebuild-feeds
r2_use_path_style: false

# Build execution: "local" runs builds on the worker host; "static" uses SSH to listed VMs.
build_backend: local
max_parallel_builds: 1
# static_vms:
#   - host: build-vm.example.com
#     user: builder
#     port: 22
#     ssh_key_path: /home/you/.ssh/id_ed25519

# Authentication: password-based admin (see securebuild-docs / password auth proposal).
# For GitHub OAuth, use auth_method: github and configure the app OAuth env vars instead.
auth_method: password
admin_user_email: admin@example.com      # only if SMTP is not configured in the app
admin_user_password: clear-text-password  # only if SMTP is not configured in the app

log_level: info
